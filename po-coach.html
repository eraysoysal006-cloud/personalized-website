<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }

  :root {
    --text-primary: #F5F5F4;
    --text-secondary: #B7B7B2;
    --text-tertiary: #8A8A85;
    --success: #5C7FEA;
    --warning: #FBBF24;
    --danger: #F87171;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --card-bg: rgba(255,255,255,0.04);
    --card-radius: 16px;
    --card-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }

  body {
    background-color: #08090B;
    font-family: var(--font-sans);
    color: var(--text-primary);
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top, 32px) + 22px) 24px calc(96px + env(safe-area-inset-bottom));
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .back-link {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    text-decoration: none;
  }
  .back-link:hover { color: var(--text-primary); }

  .dash-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.025em;
    background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
  }

  /* CONTEXT CARD */
  .context-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 14px 18px;
    backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: var(--card-shadow);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .context-item { display: flex; flex-direction: column; gap: 2px; }
  .context-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .context-value {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .context-value.is-streak { color: var(--success); }

  /* CHAT */
  .chat-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 16px;
    backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: var(--card-shadow);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
    min-height: 320px;
    max-height: 60vh;
  }

  .chat-empty {
    margin: auto;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 12px;
    font-style: italic;
    max-width: 280px;
  }

  .msg {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(180deg, #7B9BF5 0%, #5C7FEA 100%);
    color: #08090B;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
    border: 1px solid rgba(255,255,255,0.06);
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: rgba(255,107,107,0.10);
    color: var(--danger);
    border: 1px solid rgba(255,107,107,0.25);
    font-size: 12px;
  }

  .msg.typing { color: var(--text-tertiary); font-style: italic; }

  /* INPUT */
  .chat-input-row {
    display: flex;
    flex-direction: row;
    gap: 8px;
    align-items: flex-end;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 14px;
    margin-top: 14px;
  }

  .chat-input {
    flex: 1;
    resize: none;
    padding: 11px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    outline: none;
    max-height: 120px;
    transition: border-color 0.2s;
  }
  .chat-input::placeholder { color: var(--text-tertiary); }
  .chat-input:focus { border-color: rgba(255,255,255,0.25); }

  .chat-send-btn {
    padding: 11px 20px;
    border-radius: 12px;
    background: linear-gradient(180deg, #7B9BF5 0%, #5C7FEA 100%);
    color: #08090B;
    border: none;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 4px 12px rgba(0,0,0,0.3);
    transition: transform 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  .chat-send-btn:hover { transform: translateY(-1px); }
  .chat-send-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  .chat-mic-btn {
    padding: 11px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    color: var(--text-primary);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .chat-mic-btn:hover { background: rgba(255,255,255,0.10); }
  .chat-mic-btn:disabled { opacity: 0.5; cursor: default; }
  .chat-mic-btn.is-recording {
    background: rgba(248,113,113,0.15);
    border-color: rgba(248,113,113,0.4);
    color: var(--danger);
    animation: micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.35); }
    50% { box-shadow: 0 0 0 7px rgba(248,113,113,0); }
  }

  .chat-status {
    font-size: 11px;
    color: var(--text-tertiary);
    min-height: 16px;
    margin-top: 6px;
  }
  .chat-status.is-error { color: var(--danger); }

  /* TAB BAR (shared across index.html / po-coach.html / gym.html) */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; justify-content: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(5,5,6,0) 0%, rgba(5,5,6,0.78) 38%, rgba(5,5,6,0.94) 100%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events: none;
  }
  .tabbar-inner {
    pointer-events: auto;
    display: flex; width: 100%; max-width: 460px; gap: 6px; padding: 6px;
    background: rgba(20,20,22,0.72);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.55);
  }
  .tab {
    flex: 1 1 0;
    min-width: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 6px; border-radius: 13px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text-secondary);
    text-decoration: none;
    background: transparent; border: 1px solid transparent;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .tab:hover { color: var(--text-primary); }
  .tab[aria-current="page"] {
    color: var(--text-primary);
    background: rgba(92,127,234,0.10);
    border-color: rgba(92,127,234,0.25);
  }
  .tab-icon { width: 18px; height: 18px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .tab-icon svg { width: 100%; height: 100%; display: block; }

  @media (max-width: 480px) {
    .tab { padding: 10px 3px; font-size: 10.5px; gap: 3px; }
    .tab-icon { width: 16px; height: 16px; }
  }
</style>

<div class="top-row">
  <h1 class="dash-title">Coach</h1>
</div>

<div class="context-card">
  <div class="context-item">
    <span class="context-label">TODAY</span>
    <span class="context-value" id="ctxDate">…</span>
  </div>
  <div class="context-item">
    <span class="context-label">GOALS</span>
    <span class="context-value" id="ctxGoals">0/0</span>
  </div>
  <div class="context-item">
    <span class="context-label">STREAK</span>
    <span class="context-value is-streak" id="ctxStreak">0</span>
  </div>
</div>

<div class="chat-card">
  <div class="chat-messages" id="chatMessages">
    <div class="chat-empty" id="chatEmpty">Ask your coach anything about today's goals — it can see what's done, what's pending, and your streak.</div>
  </div>
  <div class="chat-input-row">
    <textarea class="chat-input" id="chatInput" rows="1" placeholder="Talk to your coach…"></textarea>
    <button class="chat-mic-btn" id="chatMicBtn" type="button" title="Voice message">🎙️</button>
    <button class="chat-send-btn" id="chatSendBtn">Send</button>
  </div>
  <div class="chat-status" id="chatStatus"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared-auth.js"></script>
<script>
// ─── SUPABASE (client + auth owned by shared-auth.js) ────────────────────────
const sb = window.sb;
const APP_KEY = 'po-coach';

// ─── DATES (same 6 AM day-boundary logic as the dashboard) ──────────────────
// Local calendar date as YYYY-MM-DD — never toISOString() for this, it
// converts to UTC first and silently shifts the date in positive-offset
// timezones (e.g. a local-midnight Date becomes "yesterday" in UTC).
function toDateKey(dt) {
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function getActiveDateString() {
  const now = new Date();
  if (now.getHours() < 6) now.setDate(now.getDate() - 1);
  return toDateKey(now);
}
function formatDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

// ─── STORAGE (localStorage; mirrored to Supabase by the sync engine below) ──
function storeGet(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function storeSet(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

// ─── CONTEXT (today's goals + streak, read-only — pulled straight from the
//     dashboard's synced `app_state` row so it's correct even if this device
//     never opened index.html) ─────────────────────────────────────────────
let todayContext = { date: '', goals: [], streak: 0 };

function applyDashboardContext(state) {
  const date = getActiveDateString();
  let goals = [];
  let streak = 0;
  if (state) {
    if (state['goals:' + date]) goals = JSON.parse(state['goals:' + date]);
    if (state['goal_streak_v1']) streak = JSON.parse(state['goal_streak_v1']).count || 0;
  }
  todayContext = { date, goals, streak };

  document.getElementById('ctxDate').textContent = formatDate(date);
  const done = goals.filter(g => g.done).length;
  document.getElementById('ctxGoals').textContent = `${done}/${goals.length}`;
  document.getElementById('ctxStreak').textContent = streak;
}

async function loadContext() {
  try {
    const { data: row, error } = await sb.from('app_state').select('data').eq('key', 'dashboard').eq('user_id', window.pcUserId).maybeSingle();
    if (error) throw error;
    applyDashboardContext(row && row.data);
  } catch (e) {
    console.error('Failed to load dashboard context:', e);
    applyDashboardContext(null);
  }
}

// Live-updates the context card whenever the dashboard's own app_state row changes,
// independent of this page's own sync channel (which only covers coach_chat_history).
function subscribeDashboardContext() {
  sb.channel('app_state_dashboard_context')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'app_state', filter: 'key=eq.dashboard' },
      (payload) => {
        const state = payload.new && payload.new.data;
        if (state) applyDashboardContext(state);
      })
    .subscribe();
}

function buildSystemPrompt() {
  const { date, goals, streak } = todayContext;
  const lines = goals.length
    ? goals.map(g => `- [${g.done ? 'x' : ' '}] ${g.text}`).join('\n')
    : '(no goals set for today)';
  return `You are a supportive, direct personal coach helping the user follow through on their daily goals and nutrition. Be concise (a few sentences unless asked for more), encouraging but honest, and refer to their actual goals below when relevant. Don't be sycophantic. The user usually writes in Turkish — reply in the same language they use.

Today: ${formatDate(date)}
Current streak: ${streak} day(s)
Goals:
${lines}

NUTRITION LOGGING: if (and only if) the user's message describes something they ate or drank, estimate its nutrition and append exactly one line at the very end of your reply, on its own line, in this exact machine-readable format (the app parses and hides this line from the user, so it must match exactly):
NUTRITION_LOG: {"text":"short description","calories":number,"protein":number,"carbs":number,"fat":number,"fiber":number}
Use your best real-world estimate for a typical portion if they don't give exact amounts — NEVER ask a clarifying question about quantity, ingredients, or preparation first. Estimate and log immediately, every time. Do not add this line for messages that aren't about food/drink. Never mention this tag to the user or explain that you're logging anything in a technical way.

IMPORTANT — when the user is just telling you what they ate (not asking a question), this is a quick logging tool, not a conversation: keep the reply to one short, natural sentence in casual Turkish, like a friend jotting it down, and always state the macros — not just calories — using the exact same numbers as your NUTRITION_LOG tag: protein, carbs and fat (kcal too if it fits naturally, fiber optional). E.g. "Not ettim: ~420 kcal, 35p 10c 28f" or "Tamamdır — 30g protein, 45g karbonhidrat, 12g yağ civarı". Vary the phrasing naturally instead of repeating the same template every time. Never use the literal word "Logged" or robotic-sounding confirmations. Never ask follow-up questions unless the user explicitly asks you something. Don't chit-chat, don't add extra commentary or encouragement unless asked. Every reply costs the user real money, so be as brief as possible while still being useful. But if the user is explicitly ASKING for something (a meal idea, a plan, advice, an explanation), answer that properly and helpfully — the brevity rule is only for passive "here's what I ate" logging, not for real questions.

The user will also mention things like alcohol or a "cheat meal" sometimes — treat those exactly like any other food/drink mention (estimate and log via NUTRITION_LOG, same as above), don't ask about them separately or treat them as a special case needing confirmation.

FOOD CONTEXT — the user currently wants to bulk (gain muscle/weight, calorie surplus, protein-focused). He's a student living alone with a limited, repetitive pantry — he usually only has: chicken, ground beef (kıyma/köfte), cheddar cheese, milk, kiwi, banana, tomato paste/sauce (salça), onion, and mushroom. He does NOT usually have bell peppers or much other fresh produce beyond that. When he asks for meal/recipe ideas, suggest things realistically buildable from these staples (plus cheap easy additions like rice, pasta, eggs, bread if relevant) rather than generic recipes needing ingredients he won't have — and lean toward higher-calorie, higher-protein options since he's bulking.`;
}

// ─── CHAT STATE ───────────────────────────────────────────────────────────────
let messages = []; // { role: 'user' | 'assistant', content: string }

async function loadChatHistory() {
  messages = storeGet('coach_chat_history') || [];
  renderMessages();
}
function saveChatHistory() {
  storeSet('coach_chat_history', messages);
}

function renderMessages() {
  const el = document.getElementById('chatMessages');
  const emptyEl = document.getElementById('chatEmpty');
  el.querySelectorAll('.msg').forEach(n => n.remove());
  emptyEl.style.display = messages.length ? 'none' : 'block';
  for (const m of messages) {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;
    div.textContent = m.content;
    el.appendChild(div);
  }
  el.scrollTop = el.scrollHeight;
}

function showStatus(msg, isError) {
  const el = document.getElementById('chatStatus');
  el.textContent = msg;
  el.classList.toggle('is-error', !!isError);
}

async function callClaude() {
  const resp = await fetch('/api/anthropic', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + window.pcAccessToken
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 300,
      system: buildSystemPrompt(),
      messages: messages.map(m => ({ role: m.role, content: m.content }))
    })
  });
  if (!resp.ok) throw new Error('API error ' + resp.status);
  const data = await resp.json();
  return data.content[0].text;
}

// Pulls a "NUTRITION_LOG: {...}" tag out of the coach's reply (if present) so
// it never shows up in the chat bubble, and returns the parsed entry. Scans
// braces by hand (rather than a regex anchored to end-of-string) so it still
// works if the model puts anything after the tag or the object isn't flat.
function extractNutritionTag(text) {
  const tagIdx = text.indexOf('NUTRITION_LOG:');
  if (tagIdx === -1) return { cleanText: text, entry: null };
  const braceStart = text.indexOf('{', tagIdx);
  if (braceStart === -1) return { cleanText: text, entry: null };
  let depth = 0, braceEnd = -1;
  for (let i = braceStart; i < text.length; i++) {
    if (text[i] === '{') depth++;
    else if (text[i] === '}') { depth--; if (depth === 0) { braceEnd = i; break; } }
  }
  if (braceEnd === -1) return { cleanText: text, entry: null };
  let entry = null;
  try { entry = JSON.parse(text.slice(braceStart, braceEnd + 1)); } catch (e) { console.error('Bad NUTRITION_LOG tag:', e); }
  return { cleanText: text.slice(0, tagIdx).trim(), entry };
}

// Nutrition data lives on the dashboard's own app_state row (key: 'dashboard'),
// not this page's. Read-modify-write, merging onto whatever's already there.
// The dashboard tab (index.html) writes to this exact row too, on its own
// periodic sync cycle — so this uses an optimistic-concurrency check
// (updated_at must match what we just read) and retries on conflict,
// otherwise a dashboard push landing between our read and write could
// silently overwrite the entry we're trying to log (or vice versa).
async function logNutritionEntry(entry) {
  const date = getActiveDateString();
  const nutritionKey = 'nutrition:' + date;
  try {
    for (let attempt = 0; attempt < 5; attempt++) {
      const { data: row, error: readErr } = await sb.from('app_state').select('data, updated_at').eq('key', 'dashboard').eq('user_id', window.pcUserId).maybeSingle();
      if (readErr) throw readErr;
      const remoteData = Object.assign({}, (row && row.data) || {});
      const existing = remoteData[nutritionKey] ? JSON.parse(remoteData[nutritionKey]) : [];
      existing.push(entry);
      remoteData[nutritionKey] = JSON.stringify(existing);

      if (!row) {
        const { error } = await sb.from('app_state').insert({ key: 'dashboard', user_id: window.pcUserId, data: remoteData, updated_at: new Date().toISOString() });
        if (!error) return;
        continue; // someone else created the row between our read and write — retry as an update
      }
      const { data: updated, error } = await sb.from('app_state')
        .update({ data: remoteData, updated_at: new Date().toISOString() })
        .eq('key', 'dashboard').eq('user_id', window.pcUserId).eq('updated_at', row.updated_at)
        .select();
      if (error) throw error;
      if (updated && updated.length) return;
      // else: the dashboard (or another Coach tab) wrote in between — retry with a fresh read
    }
    console.error('logNutritionEntry: gave up after repeated conflicts');
  } catch (e) {
    console.error('Failed to log nutrition entry:', e);
  }
}

// ─── WEEKLY RECAP (Sunday evening) ───────────────────────────────────────────
// The first time the Coach page is opened at/after Sunday 18:00, generate a
// short review of the past 7 days and drop it into the chat as an assistant
// message — no backend/cron involved, this is purely "next time you open it".
// coach_last_recap_week is synced (see SYNC_EXACT_KEYS below) so a second
// device won't regenerate it once one device already has.
function mostRecentSundayMidnight(d) {
  const r = new Date(d);
  r.setDate(r.getDate() - r.getDay());
  r.setHours(0, 0, 0, 0);
  return r;
}

async function maybeGenerateWeeklyRecap() {
  const now = new Date();
  const sunday = mostRecentSundayMidnight(now);
  const boundary = new Date(sunday);
  boundary.setHours(18, 0, 0, 0);
  if (now < boundary) return; // this week's Sunday-evening window hasn't started yet
  const weekKey = toDateKey(sunday);
  if (storeGet('coach_last_recap_week') === weekKey) return; // already recapped this week

  try {
    const { data: row, error } = await sb.from('app_state').select('data').eq('key', 'dashboard').maybeSingle();
    if (error) throw error;
    const state = (row && row.data) || {};
    const defs = state['habits:definitions'] ? JSON.parse(state['habits:definitions']) : [];

    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now); d.setDate(d.getDate() - i);
      days.push(toDateKey(d));
    }

    let totalCal = 0, totalProt = 0, loggedDays = 0;
    for (const day of days) {
      const raw = state['nutrition:' + day];
      if (!raw) continue;
      const entries = JSON.parse(raw);
      if (!entries.length) continue;
      loggedDays++;
      for (const e of entries) { totalCal += Number(e.calories) || 0; totalProt += Number(e.protein) || 0; }
    }
    const avgCal = loggedDays ? Math.round(totalCal / loggedDays) : 0;
    const avgProt = loggedDays ? Math.round(totalProt / loggedDays) : 0;

    let habitDone = 0, habitTotal = 0;
    for (const day of days) {
      const log = state['habits:log:' + day] ? JSON.parse(state['habits:log:' + day]) : {};
      for (const h of defs) {
        habitTotal++;
        const entry = log[h.id];
        const done = (h.subItems && h.subItems.length)
          ? !!(entry && typeof entry === 'object' && h.subItems.every(si => entry[si.id]))
          : !!entry;
        if (done) habitDone++;
      }
    }

    const streak = state['goal_streak_v1'] ? (JSON.parse(state['goal_streak_v1']).count || 0) : 0;

    const facts = `Last 7 days (${days[0]} to ${days[6]}):
- Nutrition logged on ${loggedDays}/7 days. On logged days, avg ${avgCal} kcal/day and ${avgProt}g protein/day.
- Habits completed: ${habitDone}/${habitTotal} (across all habits, all 7 days).
- Current daily-goal streak: ${streak} days.`;

    const resp = await fetch('/api/anthropic', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + window.pcAccessToken
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 220,
        system: 'You are a terse, warm coach texting in Turkish. Given the week\'s stats below, write a short (3-5 sentence) Sunday-evening week-in-review as a natural text message — what went well, one honest thing to improve, no bullet lists, no headers, no fluff, not preachy. He is bulking (calorie surplus, protein-focused goal).',
        messages: [{ role: 'user', content: facts }]
      })
    });
    if (!resp.ok) throw new Error('Recap API error ' + resp.status);
    const data = await resp.json();
    const text = data.content[0].text;

    messages.push({ role: 'assistant', content: text });
    saveChatHistory();
    renderMessages();
    storeSet('coach_last_recap_week', weekKey);
  } catch (e) {
    console.error('Weekly recap failed:', e);
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  const text = input.value.trim();
  if (!text) return;

  messages.push({ role: 'user', content: text });
  renderMessages();
  saveChatHistory();
  input.value = '';
  input.style.height = 'auto';

  sendBtn.disabled = true;
  showStatus('');
  const el = document.getElementById('chatMessages');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg assistant typing';
  typingEl.textContent = 'Coach is thinking…';
  el.appendChild(typingEl);
  el.scrollTop = el.scrollHeight;

  try {
    const reply = await callClaude();
    const { cleanText, entry } = extractNutritionTag(reply);
    messages.push({ role: 'assistant', content: cleanText || reply });
    saveChatHistory();
    if (entry) {
      logNutritionEntry(entry);
      loadContext();
    }
  } catch (err) {
    console.error(err);
    showStatus('Message failed — try again.', true);
  } finally {
    typingEl.remove();
    renderMessages();
    sendBtn.disabled = false;
    input.focus();
  }
}

document.getElementById('chatSendBtn').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById('chatInput').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ─── VOICE INPUT (record → Groq Whisper transcription) ──────────────────────
let mediaRecorder = null;
let audioChunks = [];
let micStream = null;

function pickMicMimeType() {
  const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
  for (const t of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

async function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showStatus('Microphone access denied.', true);
    return;
  }
  audioChunks = [];
  const mimeType = pickMicMimeType();
  mediaRecorder = new MediaRecorder(micStream, mimeType ? { mimeType } : undefined);
  mediaRecorder.addEventListener('dataavailable', (e) => { if (e.data.size > 0) audioChunks.push(e.data); });
  mediaRecorder.addEventListener('stop', () => {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
    document.getElementById('chatMicBtn').classList.remove('is-recording');
    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    if (blob.size > 0) transcribeAndFill(blob);
  });
  mediaRecorder.start();
  document.getElementById('chatMicBtn').classList.add('is-recording');
  showStatus('Recording… tap the mic again to stop.');
}

async function transcribeAndFill(blob) {
  const micBtn = document.getElementById('chatMicBtn');
  micBtn.disabled = true;
  showStatus('Transcribing…');
  try {
    const ext = (blob.type.includes('mp4')) ? 'mp4' : (blob.type.includes('ogg') ? 'ogg' : 'webm');
    const form = new FormData();
    form.append('file', blob, 'voice.' + ext);
    form.append('model', 'whisper-large-v3-turbo');
    form.append('language', 'tr');
    form.append('response_format', 'json');
    const resp = await fetch('/api/transcribe', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + window.pcAccessToken },
      body: form
    });
    if (!resp.ok) throw new Error('Transcription API error ' + resp.status);
    const data = await resp.json();
    const text = (data.text || '').trim();
    if (!text) { showStatus('Could not hear anything — try again.', true); return; }
    const input = document.getElementById('chatInput');
    input.value = (input.value ? input.value + ' ' : '') + text;
    input.dispatchEvent(new Event('input'));
    input.focus();
    showStatus('');
  } catch (e) {
    console.error(e);
    showStatus('Transcription failed — try again.', true);
  } finally {
    micBtn.disabled = false;
  }
}

document.getElementById('chatMicBtn').addEventListener('click', toggleRecording);

// ─── SUPABASE SYNC ────────────────────────────────────────────────────────────
// Keeps localStorage mirrored to the `app_state` row for APP_KEY across devices.
const SYNC_PREFIXES = [];
const SYNC_EXACT_KEYS = ['coach_chat_history', 'coach_last_recap_week'];

function isSyncedKey(key) {
  return SYNC_EXACT_KEYS.includes(key) || SYNC_PREFIXES.some(p => key.startsWith(p));
}

const rawSetItem = localStorage.setItem.bind(localStorage);
const rawRemoveItem = localStorage.removeItem.bind(localStorage);

function snapshotSyncedState() {
  const out = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (isSyncedKey(k)) out[k] = localStorage.getItem(k);
  }
  return out;
}

function applySyncedState(state) {
  const current = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (isSyncedKey(k)) current.push(k);
  }
  for (const k of current) if (!(k in state)) rawRemoveItem(k);
  for (const [k, v] of Object.entries(state)) rawSetItem(k, v);
}

function isEditingField() {
  const el = document.activeElement;
  if (!el) return false;
  return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable;
}

function refreshFromStorage() {
  messages = storeGet('coach_chat_history') || [];
  renderMessages();
}

let lastSyncedJson = null;
let pendingRemote = null;
let pushTimer = null;

function schedulePush() {
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 250);
}

async function pushNow() {
  pushTimer = null;
  const state = snapshotSyncedState();
  const json = JSON.stringify(state);
  if (json === lastSyncedJson) return;
  lastSyncedJson = json;
  try {
    const { error } = await sb.from('app_state')
      .upsert({ key: APP_KEY, user_id: window.pcUserId, data: state, updated_at: new Date().toISOString() }, { onConflict: 'user_id,key' });
    if (error) console.error('Sync push error:', error);
  } catch (e) { console.error('Sync push failed:', e); }
}

localStorage.setItem = function (key, value) {
  rawSetItem(key, value);
  try { if (isSyncedKey(key)) schedulePush(); } catch (e) { console.error(e); }
};
localStorage.removeItem = function (key) {
  rawRemoveItem(key);
  try { if (isSyncedKey(key)) schedulePush(); } catch (e) { console.error(e); }
};

function applyRemote(state) {
  if (isEditingField()) { pendingRemote = state; return; }
  applySyncedState(state);
  refreshFromStorage();
}

document.addEventListener('focusout', () => {
  if (pendingRemote) {
    const state = pendingRemote;
    pendingRemote = null;
    applySyncedState(state);
    refreshFromStorage();
  }
});

async function pullAndApply() {
  const { data: row, error } = await sb.from('app_state').select('data').eq('key', APP_KEY).eq('user_id', window.pcUserId).maybeSingle();
  if (error) { console.error('Sync pull error:', error); return; }
  if (!row || !row.data || Object.keys(row.data).length === 0) {
    const local = snapshotSyncedState();
    if (Object.keys(local).length > 0) {
      lastSyncedJson = JSON.stringify(local);
      await sb.from('app_state').upsert({ key: APP_KEY, user_id: window.pcUserId, data: local, updated_at: new Date().toISOString() }, { onConflict: 'user_id,key' });
    }
    return;
  }
  lastSyncedJson = JSON.stringify(row.data);
  applyRemote(row.data);
}

function subscribeRealtime() {
  sb.channel('app_state_' + APP_KEY)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'app_state', filter: `key=eq.${APP_KEY}` },
      (payload) => {
        const newState = payload.new && payload.new.data;
        if (!newState) return;
        const json = JSON.stringify(newState);
        if (json === lastSyncedJson) return;
        lastSyncedJson = json;
        applyRemote(newState);
      })
    .subscribe();
}

function flushSync() {
  if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
  const state = snapshotSyncedState();
  const json = JSON.stringify(state);
  if (json === lastSyncedJson) return;
  lastSyncedJson = json;
  try {
    fetch(`${window.SUPABASE_URL}/rest/v1/app_state?on_conflict=user_id,key`, {
      method: 'POST',
      keepalive: true,
      headers: {
        'Content-Type': 'application/json',
        'apikey': window.SUPABASE_KEY,
        'Authorization': 'Bearer ' + window.pcAccessToken,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ key: APP_KEY, user_id: window.pcUserId, data: state, updated_at: new Date().toISOString() })
    });
  } catch (e) { console.error('Sync flush failed:', e); }
}

window.addEventListener('pagehide', flushSync);
window.addEventListener('beforeunload', flushSync);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSync(); });

// ─── INIT ────────────────────────────────────────────────────────────────────
(async () => {
  await window.pcAuthGate();
  await loadContext();
  subscribeDashboardContext();
  await pullAndApply();
  subscribeRealtime();
  messages = storeGet('coach_chat_history') || [];
  renderMessages();
  maybeGenerateWeeklyRecap();
})();
</script>
