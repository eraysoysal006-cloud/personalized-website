<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  .hidden { display: none !important; }

  :root {
    --text-primary: #F5F5F4;
    --text-secondary: #B7B7B2;
    --text-tertiary: #8A8A85;
    --success: #5C7FEA;
    --warning: #FBBF24;
    --danger: #F87171;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --card-bg: rgba(255,255,255,0.04);
    --card-radius: 16px;
    --card-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }

  body {
    background-color: #08090B;
    font-family: var(--font-sans);
    color: var(--text-primary);
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top, 32px) + 22px) 24px calc(96px + env(safe-area-inset-bottom));
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .dash-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.025em;
    background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
  }

  /* STUDY CARD */
  .study-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 18px 22px;
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: var(--card-shadow);
    margin-bottom: 14px;
  }

  .study-eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }

  .study-total-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 16px;
  }
  .study-total-num {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .study-total-label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .study-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-width: 0;
    margin-bottom: 14px;
  }
  .study-subject-input {
    flex: 1 1 160px;
    min-width: 0;
    padding: 11px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    outline: none;
  }
  .study-subject-input::placeholder { color: var(--text-tertiary); }
  .study-subject-input:focus { border-color: rgba(255,255,255,0.25); }
  .study-minutes-input {
    width: 70px;
    flex-shrink: 0;
    min-width: 0;
    padding: 11px 8px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
    outline: none;
    -moz-appearance: textfield;
  }
  .study-minutes-input::-webkit-outer-spin-button,
  .study-minutes-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .study-minutes-input:focus { border-color: rgba(255,255,255,0.25); }
  .study-log-btn {
    flex-shrink: 0;
    padding: 11px 20px;
    border-radius: 12px;
    background: linear-gradient(180deg, #7B9BF5 0%, #5C7FEA 100%);
    color: #08090B;
    border: none;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 4px 12px rgba(0,0,0,0.3);
  }

  .study-list { list-style: none; }
  .study-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.035);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .study-item-text {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .study-item-minutes {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .study-item-del {
    background: none;
    border: none;
    color: var(--text-tertiary);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .study-item-del:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 14px 0;
    font-size: 12px;
    color: var(--text-tertiary);
    font-style: italic;
  }

  /* WEEKLY SCHEDULE */
  .schedule-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .schedule-day { min-width: 0; }
  .schedule-day-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .schedule-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding: 8px 10px;
    margin-bottom: 4px;
    background: rgba(255,255,255,0.035);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .schedule-row-time {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--success);
    flex-shrink: 0;
  }
  .schedule-row-course {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* TIMER (stopwatch + pomodoro) */
  .timer-mode-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 4px;
  }
  .timer-mode-btn {
    flex: 1;
    padding: 9px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    border-radius: 9px;
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .timer-mode-btn.active {
    background: linear-gradient(180deg, #7B9BF5 0%, #5C7FEA 100%);
    color: #08090B;
  }
  .timer-display {
    font-family: var(--font-mono);
    font-size: 46px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: center;
    letter-spacing: -0.02em;
    margin: 8px 0 2px;
  }
  .pomodoro-phase-label {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 12px;
  }
  .timer-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .timer-controls .study-log-btn { flex: 1 1 100px; min-width: 0; }
  .pomodoro-settings {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .pomodoro-settings label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    min-width: 0;
  }
  .pomodoro-settings input {
    width: 54px;
    min-width: 0;
    padding: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    -moz-appearance: textfield;
  }
  .pomodoro-settings input::-webkit-outer-spin-button,
  .pomodoro-settings input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* SUMMARY POPUP */
  .study-modal-bg {
    display: none;
    position: fixed; inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .study-modal-bg.show { display: flex; }
  .study-modal {
    width: 100%; max-width: 320px;
    background: #101115;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }
  @keyframes studyModalPopIn {
    from { opacity: 0; transform: scale(0.92) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .study-modal-bg.show .study-modal {
    animation: studyModalPopIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .study-modal-emoji { font-size: 40px; margin-bottom: 6px; }
  .study-modal-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .study-modal-motivation { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
  .study-modal-total { font-size: 26px; font-weight: 800; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .study-modal-total-label {
    font-size: 10.5px; color: var(--text-tertiary); text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 20px;
  }
  .study-modal-close-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    background: linear-gradient(180deg, #7B9BF5 0%, #5C7FEA 100%);
    color: #08090B;
    border: none;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* TAB BAR (shared across index.html / po-coach.html / gym.html / study.html) */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; justify-content: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(5,5,6,0) 0%, rgba(5,5,6,0.78) 38%, rgba(5,5,6,0.94) 100%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events: none;
  }
  .tabbar-inner {
    pointer-events: auto;
    display: flex; width: 100%; max-width: 460px; gap: 6px; padding: 6px;
    background: rgba(20,20,22,0.72);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.55);
  }
  .tab {
    flex: 1 1 0;
    min-width: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 6px; border-radius: 13px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text-secondary);
    text-decoration: none;
    background: transparent; border: 1px solid transparent;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .tab:hover { color: var(--text-primary); }
  .tab[aria-current="page"] {
    color: var(--text-primary);
    background: rgba(92,127,234,0.10);
    border-color: rgba(92,127,234,0.25);
  }
  .tab-icon { width: 18px; height: 18px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .tab-icon svg { width: 100%; height: 100%; display: block; }

  @media (max-width: 480px) {
    .dash-title { font-size: 22px; }
    .tab { padding: 10px 3px; font-size: 10.5px; gap: 3px; }
    .tab-icon { width: 16px; height: 16px; }
  }
</style>
</head>

<h1 class="dash-title">Study</h1>

<div class="study-card" id="scheduleCard">
  <div class="study-eyebrow">Haftalık Program</div>
  <div class="schedule-grid" id="scheduleGrid"></div>
  <button class="study-log-btn" id="scheduleAddBtn" type="button" style="width:100%;margin-top:12px;">+ Ders ekle</button>
</div>

<div class="study-card" id="timerCard">
  <div class="study-eyebrow">Zamanlayıcı</div>
  <div class="timer-mode-toggle">
    <button class="timer-mode-btn active" id="timerModeStopwatch" type="button">Kronometre</button>
    <button class="timer-mode-btn" id="timerModePomodoro" type="button">Pomodoro</button>
  </div>
  <input class="study-subject-input" id="timerSubject" type="text" placeholder="Ders/konu…" style="width:100%;margin-bottom:10px;" autocomplete="off">

  <div id="stopwatchView">
    <div class="timer-display" id="stopwatchDisplay">00:00</div>
    <div class="timer-controls">
      <button class="study-log-btn" id="stopwatchStartBtn" type="button">Başlat</button>
      <button class="study-log-btn hidden" id="stopwatchStopBtn" type="button">Bitir &amp; Kaydet</button>
    </div>
  </div>

  <div id="pomodoroView" class="hidden">
    <div class="timer-display" id="pomodoroDisplay">25:00</div>
    <div class="pomodoro-phase-label" id="pomodoroPhaseLabel">Çalışma</div>
    <div class="timer-controls">
      <button class="study-log-btn" id="pomodoroStartBtn" type="button">Başlat</button>
      <button class="study-log-btn hidden" id="pomodoroPauseBtn" type="button">Duraklat</button>
      <button class="study-log-btn hidden" id="pomodoroResetBtn" type="button">Sıfırla</button>
    </div>
    <div class="pomodoro-settings">
      <label>Çalışma <input type="number" id="pomodoroWorkMin" min="1" max="120" value="25"> dk</label>
      <label>Mola <input type="number" id="pomodoroBreakMin" min="1" max="60" value="5"> dk</label>
    </div>
  </div>
</div>

<div class="study-card" id="studyCard">
  <div class="study-eyebrow" id="studyDateLabel">TODAY</div>
  <div class="study-total-row">
    <span class="study-total-num" id="studyTotalNum">0</span>
    <span class="study-total-label">dk çalıştın bugün</span>
  </div>
  <div class="study-form">
    <input class="study-subject-input" id="studySubject" type="text" placeholder="Ders/konu…" autocomplete="off">
    <input class="study-minutes-input" id="studyMinutes" type="number" min="1" max="600" placeholder="dk">
    <button class="study-log-btn" id="studyLogBtn" type="button">Log</button>
  </div>
  <ul class="study-list" id="studyList"></ul>
  <div class="empty-state" id="studyEmptyState">Henüz bugün çalışma loglanmadı.</div>
</div>

<div class="study-modal-bg" id="studySummaryModalBg">
  <div class="study-modal">
    <div class="study-modal-emoji">📚</div>
    <div class="study-modal-title">Kaydedildi</div>
    <div class="study-modal-motivation" id="studySummaryMotivation"></div>
    <div class="study-modal-total" id="studySummaryTotal">0 dk</div>
    <div class="study-modal-total-label">bugün toplam</div>
    <button class="study-modal-close-btn" id="studySummaryCloseBtn" type="button">Tamam</button>
  </div>
</div>

<div class="study-modal-bg" id="scheduleAddModalBg">

      <option value="Mon">Pazartesi</option>

      <option value="Wed">Çarşamba</option>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://mxgrrjyoosiywksxzlje.supabase.co';
const SUPABASE_KEY = 'sb_publishable_K1-mePuh2s7ECxxUdUZtqQ_KY3brvIL';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const APP_KEY = 'study';

// ─── DATES (same 6 AM day-boundary logic as the other pages) ────────────────
function toDateKey(dt) {
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function getActiveDateString() {
  const now = new Date();
  if (now.getHours() < 6) now.setDate(now.getDate() - 1);
  return toDateKey(now);
}
function formatDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

// ─── STORAGE ──────────────────────────────────────────────────────────────
function storeGet(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function storeSet(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

const SESSIONS_KEY = 'study_sessions';
function sessionsLoad() {
  return storeGet(SESSIONS_KEY) || [];
}
function sessionsSave(arr) { storeSet(SESSIONS_KEY, arr); }

const STUDY_MOTIVATION = [
  'İyi gidiyorsun 📚',
  'Bir seans daha bitti.',
  'İstikrar bu şekilde kazanılır.',
  'Devam et, birikiyor.',
  'Bugün de çalıştın.',
  'Emek boşa gitmiyor.'
];

function todaySessions() {
  const today = getActiveDateString();
  return sessionsLoad().filter(s => s.date === today);
}

function renderStudy() {
  const today = getActiveDateString();
  document.getElementById('studyDateLabel').textContent = 'TODAY — ' + formatDate(today);

  const sessions = todaySessions();
  const totalMin = sessions.reduce((s, e) => s + (Number(e.minutes) || 0), 0);
  document.getElementById('studyTotalNum').textContent = totalMin;

  const list = document.getElementById('studyList');
  const empty = document.getElementById('studyEmptyState');
  list.innerHTML = '';
  if (!sessions.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const all = sessionsLoad();
  sessions.forEach((s) => {
    const li = document.createElement('li');
    li.className = 'study-item';

    const textEl = document.createElement('span');
    textEl.className = 'study-item-text';
    textEl.textContent = s.subject || 'Çalışma';
    li.appendChild(textEl);

    const minEl = document.createElement('span');
    minEl.className = 'study-item-minutes';
    minEl.textContent = s.minutes + ' dk';
    li.appendChild(minEl);

    const delBtn = document.createElement('button');
    delBtn.className = 'study-item-del';
    delBtn.type = 'button';
    delBtn.textContent = '×';
    delBtn.addEventListener('click', () => {
      const idx = all.indexOf(s);
      if (idx >= 0) all.splice(idx, 1);
      sessionsSave(all);
      renderStudy();
    });
    li.appendChild(delBtn);

    list.appendChild(li);
  });
}

function showStudySummary(totalMin) {
  document.getElementById('studySummaryMotivation').textContent =
    STUDY_MOTIVATION[Math.floor(Math.random() * STUDY_MOTIVATION.length)];
  document.getElementById('studySummaryTotal').textContent = totalMin + ' dk';
  document.getElementById('studySummaryModalBg').classList.add('show');
}
document.getElementById('studySummaryCloseBtn').addEventListener('click', () => {
  document.getElementById('studySummaryModalBg').classList.remove('show');
});
document.getElementById('studySummaryModalBg').addEventListener('click', (e) => {
  if (e.target.id === 'studySummaryModalBg') document.getElementById('studySummaryModalBg').classList.remove('show');
});

document.getElementById('studyLogBtn').addEventListener('click', () => {
  const subjectInput = document.getElementById('studySubject');
  const minutesInput = document.getElementById('studyMinutes');
  const subject = subjectInput.value.trim();
  const minutes = parseInt(minutesInput.value, 10);
  if (!minutes || minutes <= 0) return;

  const all = sessionsLoad();
  all.push({ date: getActiveDateString(), subject, minutes, at: new Date().toISOString() });
  sessionsSave(all);

  subjectInput.value = '';
  minutesInput.value = '';
  renderStudy();

  const totalMin = todaySessions().reduce((s, e) => s + (Number(e.minutes) || 0), 0);
  showStudySummary(totalMin);
});

// ─── WEEKLY SCHEDULE ──────────────────────────────────────────────────────
const SCHEDULE_KEY = 'study_schedule';
function scheduleLoad() { return storeGet(SCHEDULE_KEY) || []; }
function scheduleSave(arr) { storeSet(SCHEDULE_KEY, arr); }
const DAY_ORDER = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAY_LABELS = { Mon: 'Pazartesi', Tue: 'Salı', Wed: 'Çarşamba', Thu: 'Perşembe', Fri: 'Cuma', Sat: 'Cumartesi', Sun: 'Pazar' };

function renderSchedule() {
  const grid = document.getElementById('scheduleGrid');
  grid.innerHTML = '';
  const all = scheduleLoad();
  if (!all.length) {
    grid.innerHTML = '<div class="empty-state">Henüz program eklenmedi.</div>';
    return;
  }
  const byDay = {};
  all.forEach(c => { (byDay[c.day] = byDay[c.day] || []).push(c); });
  DAY_ORDER.forEach(day => {
    if (!byDay[day] || !byDay[day].length) return;
    const dayEntries = byDay[day].slice().sort((a, b) => a.time.localeCompare(b.time));
    const dayEl = document.createElement('div');
    dayEl.className = 'schedule-day';
    const dayLabel = document.createElement('div');
    dayLabel.className = 'schedule-day-label';
    dayLabel.textContent = DAY_LABELS[day];
    dayEl.appendChild(dayLabel);
    dayEntries.forEach(c => {
      const row = document.createElement('div');
      row.className = 'schedule-row';
      const timeEl = document.createElement('span');
      timeEl.className = 'schedule-row-time';
      timeEl.textContent = c.time;
      const courseEl = document.createElement('span');
      courseEl.className = 'schedule-row-course';
      courseEl.textContent = c.course;
      const delBtn = document.createElement('button');
      delBtn.className = 'study-item-del';
      delBtn.type = 'button';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', () => {
        const idx = all.indexOf(c);
        if (idx >= 0) all.splice(idx, 1);
        scheduleSave(all);
        renderSchedule();
      });
      row.appendChild(timeEl); row.appendChild(courseEl); row.appendChild(delBtn);
      dayEl.appendChild(row);
    });
    grid.appendChild(dayEl);
  });
}

document.getElementById('scheduleAddBtn').addEventListener('click', () => {
  document.getElementById('scheduleAddModalBg').classList.add('show');
});
document.getElementById('scheduleAddModalBg').addEventListener('click', (e) => {
  if (e.target.id === 'scheduleAddModalBg') document.getElementById('scheduleAddModalBg').classList.remove('show');
});
document.getElementById('scheduleAddSaveBtn').addEventListener('click', () => {
  const day = document.getElementById('scheduleAddDay').value;
  const time = document.getElementById('scheduleAddTime').value;
  const course = document.getElementById('scheduleAddCourse').value.trim();
  if (!time || !course) return;
  const all = scheduleLoad();
  all.push({ day, time, course });
  scheduleSave(all);
  document.getElementById('scheduleAddTime').value = '';
  document.getElementById('scheduleAddCourse').value = '';
  document.getElementById('scheduleAddModalBg').classList.remove('show');
  renderSchedule();
});

// ─── TIMER: stopwatch + configurable pomodoro ────────────────────────────
function timerFmt(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function logStudyMinutes(minutes) {
  if (minutes <= 0) return;
  const subject = document.getElementById('timerSubject').value.trim();
  const all = sessionsLoad();
  all.push({ date: getActiveDateString(), subject, minutes, at: new Date().toISOString() });
  sessionsSave(all);
  renderStudy();
}

document.getElementById('timerModeStopwatch').addEventListener('click', () => {
  document.getElementById('timerModeStopwatch').classList.add('active');
  document.getElementById('timerModePomodoro').classList.remove('active');
  document.getElementById('stopwatchView').classList.remove('hidden');
  document.getElementById('pomodoroView').classList.add('hidden');
});
document.getElementById('timerModePomodoro').addEventListener('click', () => {
  document.getElementById('timerModePomodoro').classList.add('active');
  document.getElementById('timerModeStopwatch').classList.remove('active');
  document.getElementById('pomodoroView').classList.remove('hidden');
  document.getElementById('stopwatchView').classList.add('hidden');
});

// Stopwatch
let stopwatchInterval = null;
let stopwatchStartedAt = null;
document.getElementById('stopwatchStartBtn').addEventListener('click', () => {
  stopwatchStartedAt = Date.now();
  stopwatchInterval = setInterval(() => {
    document.getElementById('stopwatchDisplay').textContent = timerFmt(Math.floor((Date.now() - stopwatchStartedAt) / 1000));
  }, 1000);
  document.getElementById('stopwatchStartBtn').classList.add('hidden');
  document.getElementById('stopwatchStopBtn').classList.remove('hidden');
});
document.getElementById('stopwatchStopBtn').addEventListener('click', () => {
  clearInterval(stopwatchInterval);
  const elapsedSec = Math.floor((Date.now() - stopwatchStartedAt) / 1000);
  logStudyMinutes(Math.max(1, Math.round(elapsedSec / 60)));
  const totalMin = todaySessions().reduce((s, e) => s + (Number(e.minutes) || 0), 0);
  showStudySummary(totalMin);
  document.getElementById('stopwatchDisplay').textContent = '00:00';
  document.getElementById('stopwatchStartBtn').classList.remove('hidden');
  document.getElementById('stopwatchStopBtn').classList.add('hidden');
});

// Pomodoro — work/break minutes are user-adjustable (default 25/5)
let pomodoroInterval = null;
let pomodoroRemaining = 25 * 60;
let pomodoroPhase = 'work';
let pomodoroRunning = false;

function pomodoroWorkSec() { return Math.max(1, parseInt(document.getElementById('pomodoroWorkMin').value, 10) || 25) * 60; }
function pomodoroBreakSec() { return Math.max(1, parseInt(document.getElementById('pomodoroBreakMin').value, 10) || 5) * 60; }
function pomodoroUpdateDisplay() {
  document.getElementById('pomodoroDisplay').textContent = timerFmt(pomodoroRemaining);
  document.getElementById('pomodoroPhaseLabel').textContent = pomodoroPhase === 'work' ? 'Çalışma' : 'Mola';
}
function pomodoroTick() {
  pomodoroRemaining--;
  if (pomodoroRemaining <= 0) {
    if (navigator.vibrate) navigator.vibrate(pomodoroPhase === 'work' ? [200, 100, 200] : 200);
    if (pomodoroPhase === 'work') {
      logStudyMinutes(Math.round(pomodoroWorkSec() / 60));
      pomodoroPhase = 'break';
      pomodoroRemaining = pomodoroBreakSec();
    } else {
      pomodoroPhase = 'work';
      pomodoroRemaining = pomodoroWorkSec();
    }
  }
  pomodoroUpdateDisplay();
}
document.getElementById('pomodoroStartBtn').addEventListener('click', () => {
  if (pomodoroRunning) return;
  if (pomodoroRemaining <= 0) pomodoroRemaining = pomodoroWorkSec();
  pomodoroInterval = setInterval(pomodoroTick, 1000);
  pomodoroRunning = true;
  document.getElementById('pomodoroStartBtn').classList.add('hidden');
  document.getElementById('pomodoroPauseBtn').classList.remove('hidden');
  document.getElementById('pomodoroResetBtn').classList.remove('hidden');
});
document.getElementById('pomodoroPauseBtn').addEventListener('click', () => {
  clearInterval(pomodoroInterval);
  pomodoroRunning = false;
  document.getElementById('pomodoroPauseBtn').classList.add('hidden');
  document.getElementById('pomodoroStartBtn').classList.remove('hidden');
  document.getElementById('pomodoroStartBtn').textContent = 'Devam';
});
document.getElementById('pomodoroResetBtn').addEventListener('click', () => {
  clearInterval(pomodoroInterval);
  pomodoroRunning = false;
  pomodoroPhase = 'work';
  pomodoroRemaining = pomodoroWorkSec();
  pomodoroUpdateDisplay();
  document.getElementById('pomodoroStartBtn').classList.remove('hidden');
  document.getElementById('pomodoroStartBtn').textContent = 'Başlat';
  document.getElementById('pomodoroPauseBtn').classList.add('hidden');
  document.getElementById('pomodoroResetBtn').classList.add('hidden');
});
document.getElementById('pomodoroWorkMin').addEventListener('change', () => {
  if (!pomodoroRunning && pomodoroPhase === 'work') { pomodoroRemaining = pomodoroWorkSec(); pomodoroUpdateDisplay(); }
});
pomodoroUpdateDisplay();

// ─── SUPABASE SYNC (same read-merge-write pattern as the other pages) ───────
const SYNC_EXACT_KEYS = ['study_sessions', 'study_schedule'];
function isSyncedKey(key) { return SYNC_EXACT_KEYS.includes(key); }

const rawSetItem = localStorage.setItem.bind(localStorage);
const rawRemoveItem = localStorage.removeItem.bind(localStorage);

function snapshotSyncedState() {
  const out = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (isSyncedKey(k)) out[k] = localStorage.getItem(k);
  }
  return out;
}
function applySyncedState(state) {
  const current = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (isSyncedKey(k)) current.push(k);
  }
  for (const k of current) if (!(k in state)) rawRemoveItem(k);
  for (const [k, v] of Object.entries(state)) rawSetItem(k, v);
}

let lastSyncedJson = null;
let pushTimer = null;

function schedulePush() {
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 250);
}

async function pushNow() {
  pushTimer = null;
  const state = snapshotSyncedState();
  const json = JSON.stringify(state);
  if (json === lastSyncedJson) return;
  try {
    const { data: row } = await sb.from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
    const merged = Object.assign({}, (row && row.data) || {}, state);
    const { error } = await sb.from('app_state')
      .upsert({ key: APP_KEY, data: merged, updated_at: new Date().toISOString() });
    if (error) console.error('Sync push error:', error);
    else lastSyncedJson = json;
  } catch (e) { console.error('Sync push failed:', e); }
}

localStorage.setItem = function (key, value) {
  rawSetItem(key, value);
  try { if (isSyncedKey(key)) schedulePush(); } catch (e) { console.error(e); }
};
localStorage.removeItem = function (key) {
  rawRemoveItem(key);
  try { if (isSyncedKey(key)) schedulePush(); } catch (e) { console.error(e); }
};

function applyRemote(state) {
  applySyncedState(state);
  renderStudy();
  renderSchedule();
}

async function pullAndApply() {
  const { data: row, error } = await sb.from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
  if (error) { console.error('Sync pull error:', error); return; }
  if (!row || !row.data || Object.keys(row.data).length === 0) {
    const local = snapshotSyncedState();
    if (Object.keys(local).length > 0) {
      lastSyncedJson = JSON.stringify(local);
      await sb.from('app_state').upsert({ key: APP_KEY, data: local, updated_at: new Date().toISOString() });
    }
    return;
  }
  lastSyncedJson = JSON.stringify(row.data);
  applyRemote(row.data);
}

function subscribeRealtime() {
  sb.channel('app_state_' + APP_KEY)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'app_state', filter: `key=eq.${APP_KEY}` },
      (payload) => {
        const newState = payload.new && payload.new.data;
        if (!newState) return;
        const json = JSON.stringify(newState);
        if (json === lastSyncedJson) return;
        lastSyncedJson = json;
        applyRemote(newState);
      })
    .subscribe();
}

function flushSync() {
  if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
  const state = snapshotSyncedState();
  const json = JSON.stringify(state);
  if (json === lastSyncedJson) return;
  lastSyncedJson = json;
  try {
    fetch(`${SUPABASE_URL}/rest/v1/app_state?key=eq.${APP_KEY}&select=data`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
      keepalive: true
    })
      .then(r => r.json())
      .catch(() => [])
      .then(rows => {
        const remote = (rows && rows[0] && rows[0].data) || {};
        const merged = Object.assign({}, remote, state);
        return fetch(`${SUPABASE_URL}/rest/v1/app_state`, {
          method: 'POST',
          keepalive: true,
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify({ key: APP_KEY, data: merged, updated_at: new Date().toISOString() })
        });
      })
      .catch(() => {});
  } catch (e) { console.error('Sync flush failed:', e); }
}

window.addEventListener('pagehide', flushSync);
window.addEventListener('beforeunload', flushSync);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSync(); });

// ─── INIT ────────────────────────────────────────────────────────────────────
(async () => {
  renderStudy();
  renderSchedule();
  await pullAndApply();
  subscribeRealtime();
})();
</script>
